<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="t d">
  <title id="t">Smart elevator</title>
  <desc id="d">A connected smart elevator with a Wi-Fi hub on top, an AI controller chip, and a presence sensor above doors that are opening.</desc>

  <g transform="translate(20 0)">
    <!-- Wi-Fi signal + hub -->
    <g fill="none" stroke="#14B8A6" stroke-width="3.5" stroke-linecap="round">
      <path d="M172.9 28.9 A10 10 0 0 1 187.1 28.9"/>
      <path d="M167.3 23.3 A18 18 0 0 1 192.7 23.3"/>
      <path d="M161.6 17.6 A26 26 0 0 1 198.4 17.6"/>
    </g>
    <circle cx="180" cy="36" r="3.5" fill="#14B8A6"/>
    <rect x="150" y="40" width="60" height="20" rx="5" fill="#0F766E"/>
    <circle cx="165" cy="50" r="3" fill="#99F6E4"/>
    <circle cx="180" cy="50" r="3" fill="#99F6E4"/>
    <circle cx="195" cy="50" r="3" fill="#99F6E4" opacity="0.5"/>

    <!-- shaft frame -->
    <rect x="70" y="60" width="220" height="300" rx="10" fill="#EEF1F5" stroke="#2B3A4A" stroke-width="6"/>

    <!-- floor indicator -->
    <rect x="130" y="76" width="100" height="34" rx="6" fill="#1F2933"/>
    <path d="M170 99 L180 83 L190 99 Z" fill="#2DD4BF"/>

    <!-- presence sensor -->
    <circle cx="180" cy="117" r="7" fill="none" stroke="#14B8A6" stroke-width="2" opacity="0.5"/>
    <circle cx="180" cy="117" r="3.5" fill="#14B8A6"/>

    <!-- lit interior -->
    <rect x="95" y="125" width="170" height="220" fill="#FFF1CF"/>

    <!-- opening doors -->
    <g stroke="#2B3A4A" stroke-width="3" fill="#CFE9E7">
      <rect x="95" y="125" width="77" height="220"/>
      <rect x="188" y="125" width="77" height="220"/>
    </g>
    <g stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="110" y1="140" x2="110" y2="330"/>
      <line x1="124" y1="140" x2="124" y2="330" opacity="0.5"/>
      <line x1="250" y1="140" x2="250" y2="330"/>
      <line x1="236" y1="140" x2="236" y2="330" opacity="0.5"/>
    </g>

    <!-- door-edge safety sensors -->
    <g fill="#14B8A6">
      <circle cx="172" cy="300" r="2.5"/>
      <circle cx="188" cy="300" r="2.5"/>
    </g>

    <!-- AI controller chip + data link -->
    <line x1="52" y1="200" x2="70" y2="200" stroke="#14B8A6" stroke-width="3" stroke-dasharray="4 4" stroke-linecap="round"/>
    <g stroke="#0F766E" stroke-width="3" stroke-linecap="round">
      <line x1="27" y1="180" x2="27" y2="186"/><line x1="36" y1="180" x2="36" y2="186"/><line x1="45" y1="180" x2="45" y2="186"/>
      <line x1="27" y1="214" x2="27" y2="220"/><line x1="36" y1="214" x2="36" y2="220"/><line x1="45" y1="214" x2="45" y2="220"/>
      <line x1="16" y1="191" x2="22" y2="191"/><line x1="16" y1="209" x2="22" y2="209"/>
    </g>
    <rect x="20" y="184" width="32" height="32" rx="6" fill="#0F766E"/>
    <rect x="25" y="189" width="22" height="22" rx="4" fill="none" stroke="#99F6E4" stroke-width="2"/>
    <circle cx="36" cy="200" r="3.5" fill="#99F6E4"/>
  </g>
</svg>
